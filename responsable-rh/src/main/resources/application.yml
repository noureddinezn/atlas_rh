spring:
  application:
    name: responsable-rh
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas_rh}
    username: ${DB_USERNAME:atlas}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    web:
      pageable:
        max-page-size: 100
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
