services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: atlas_rh
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rh_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_rh"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  rh_data:
